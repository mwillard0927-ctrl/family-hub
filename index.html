<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Hub</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#22302b;--mut:#7a857f;--acc:#2f6f5e;--acc2:#e8f1ee;--line:#e5e0d8;--red:#c0483a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:14px 16px calc(14px);padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;z-index:5}
header h1{font-size:20px}
.me{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:20px;padding:6px 12px;font-size:14px}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h2{font-size:17px;margin:4px 0 10px}
.mut{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px;background:#fff}
textarea{min-height:70px}
button.b{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
button.g{background:var(--acc2);color:var(--acc);border:none;border-radius:10px;padding:8px 12px;font:inherit}
button.x{background:none;border:none;color:var(--mut);font-size:18px;float:right}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:64px;background:none;border:none;padding:8px 2px;font-size:11px;color:var(--mut)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc);font-weight:700}
.chip{display:inline-block;border-radius:12px;padding:2px 8px;font-size:12px;color:#fff;margin-right:4px}
.bar{height:8px;background:var(--acc2);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--acc)}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.opt.v{border-color:var(--acc);background:var(--acc2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal div{padding:6px 0;border-radius:8px;font-size:14px;min-height:40px}
.cal .d{background:#fff}
.cal .t{outline:2px solid var(--acc)}
.cal .s{background:var(--acc);color:#fff}
.cal .dot{display:block;width:6px;height:6px;border-radius:3px;background:var(--red);margin:2px auto 0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk input{width:22px;height:22px;margin:0}
.chk.done .tx{text-decoration:line-through;color:var(--mut)}
.chk .tx{flex:1}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos img{width:100%;border-radius:10px;display:block}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{padding:18px;border-radius:14px;border:none;color:#fff;font-size:17px;font-weight:600}
.hide{display:none}
[data-lp]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.lpOn{outline:2px dashed var(--acc);outline-offset:2px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
#sheet .card{width:100%;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;margin:0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.ph{width:170px;height:300px;margin:10px auto;border:6px solid #222;border-radius:26px;background:#fafafa;position:relative;overflow:hidden}
.ph .tb{position:absolute;left:0;right:0;height:34px;background:#eee;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:11px;color:#555}
.ph .tb.top{top:0}.ph .tb.bot{bottom:0}
.ph .pg{position:absolute;top:44px;left:10px;right:10px}
.ph .pg i{display:block;height:10px;background:#ddd;border-radius:5px;margin-bottom:8px}
.ph .hd{background:var(--acc);height:28px;border-radius:6px;margin-bottom:10px;color:#fff;font-size:11px;padding:7px}
.ph .menu{position:absolute;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:10px;font-size:11px;padding:4px 0;animation:up .5s ease}
.ph .menu div{padding:7px 10px;border-bottom:1px solid #f0f0f0}
.ph .menu .hi{background:var(--acc2);color:var(--acc);font-weight:700}
.ph .tap{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #e8453c;transform:translate(-50%,-50%);animation:pulse 1.2s infinite}
.ph .fin{position:absolute;font-size:22px;transform:translate(-20%,0);animation:poke 1.2s infinite}
.ph .home{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:40px 12px}
.ph .home b{width:30px;height:30px;border-radius:8px;background:#ccc;display:block;margin:auto}
.ph .home b.me{background:var(--acc);font-size:18px;text-align:center;line-height:30px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,69,60,.6)}100%{box-shadow:0 0 0 16px rgba(232,69,60,0)}}
@keyframes poke{0%,100%{margin-top:6px}50%{margin-top:0}}
@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1}}
.seg{display:flex;background:var(--acc2);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--acc)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dots{text-align:center;margin:6px 0}.dots span{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--line);margin:0 3px}.dots span.on{background:var(--acc);width:20px}
.stepT{font-weight:700;text-align:center;font-size:16px;min-height:44px}
label.f{font-size:12px;color:var(--mut);display:block}
.big{font-size:28px;font-weight:700;color:var(--acc)}
</style>
</head>
<body>
<header><h1 id="ttl" data-lp="admin">🏡 Family Hub</h1><button class="me" id="meBtn"></button></header>
<main id="app"></main>
<nav id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== SETUP: paste your Supabase Project URL + anon key here (or use the in-app setup screen) ====== */
const SUPABASE = {url:"https://ksuvjhutalvwgikvsdeu.supabase.co", key:"sb_publishable_v60aHIwkGcr_a9UvWTb9jA_7qcffk8B"};
/* Family members — edit names/colors/emoji. Also editable in Settings inside the app. */
const DEFAULT_MEMBERS = [
  {name:"Matt",emoji:"🧔",color:"#2f6f5e"}
];
/* ===================================================================================== */

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const cfg=SUPABASE||ls.get("fh_sb",null);
let db,me=null,meId=ls.get("fh_meId",null),ADMIN=ls.get("fh_adm",false),tab=ls.get("fh_tab","home");
const D={members:[],notes:[],polls:[],events:[],chores:[],groceries:[],birthdays:[],photos:[]};
let calMonth=new Date();calMonth.setDate(1);let calSel=ymd(new Date());

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ago(t){if(!t)return"";const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";return new Date(t).toLocaleDateString()}
function mem(n){return D.members.find(m=>m.name===n)||{name:n,emoji:"🙂",color:"#888"}}
function chip(n){const m=mem(n);return `<span class="chip" style="background:${m.color}">${m.emoji} ${esc(m.name)}</span>`}
const strip=x=>{const{id,...r}=x;return r};
const ins=(c,o)=>db.from("items").insert({coll:c,data:o}).then(chk);
const add=(c,o)=>ins(c,{...o,by:me,at:Date.now()});
function upd(c,id,o){const cur=D[c].find(x=>x.id===id);if(!cur)return;const d=strip(cur);
  for(const k in o){if(k.includes(".")){const[a,b]=k.split(".");d[a]={...(d[a]||{}),[b]:o[k]}}else d[k]=o[k]}
  Object.assign(cur,o);render();return db.from("items").update({data:d}).eq("id",id).then(chk)}
const rm=id=>db.from("items").delete().eq("id",id).then(chk);
const del=(c,id)=>{if(confirm("Delete this?"))rm(id)};
function chk(r){if(r&&r.error)alert("Save failed: "+r.error.message);return r}

const TABS=[["home","🏠","Home"],["notes","📝","Notes"],["polls","📊","Polls"],["cal","📅","Calendar"],["chores","✅","Chores"],["grocery","🛒","Grocery"],["bdays","🎂","Birthdays"],["photos","📷","Photos"],["settings","⚙️","Settings"]];

function setup(){
  $("#nav").innerHTML="";$("#meBtn").classList.add("hide");
  $("#app").innerHTML=`<div class="card"><h2>One-time setup</h2>
  <p class="mut">In Supabase: Project Settings → API. Copy the Project URL and the anon public key.</p><br>
  <input id="sU" placeholder="https://xxxx.supabase.co"><textarea id="sK" placeholder="anon public key"></textarea>
  <button class="b" onclick="saveCfg()">Connect</button></div>`;
}
function saveCfg(){const url=val("#sU"),key=val("#sK");if(!url.startsWith("https://")||key.length<20)return alert("Check the URL and key");ls.set("fh_sb",{url,key});location.reload()}

async function start(){
  db=supabase.createClient(cfg.url,cfg.key);
  const r=await db.from("items").select("*");
  if(r.error){$("#app").innerHTML=`<div class="card"><h2>Can't reach the database</h2><p class="mut">${esc(r.error.message)}</p><br><button class="g" onclick="localStorage.removeItem('fh_sb');location.reload()">Re-enter Supabase info</button></div>`;return}
  r.data.forEach(put);
  if(!D.members.length)for(const m of DEFAULT_MEMBERS)await ins("members",m).then(x=>x.data);
  db.channel("items").on("postgres_changes",{event:"*",schema:"public",table:"items"},p=>{
    if(p.eventType==="DELETE"){for(const c in D)D[c]=D[c].filter(x=>x.id!==p.old.id)}else put(p.new);render()}).subscribe(st=>{if(st==="SUBSCRIBED")resync()});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)resync()});
  render();
}
function login(){
  $("#nav").innerHTML="";$("#meBtn").classList.add("hide");
  $("#app").innerHTML=`<div class="card"><h2>🔒 Family login</h2><p class="mut">Enter the family email and password once — this phone will stay logged in.</p><br>
  <input id="lE" type="email" placeholder="Family email" autocomplete="username"><input id="lP" type="password" placeholder="Password" autocomplete="current-password">
  <button class="b" onclick="doLogin()">Log in</button></div>`;
}
async function doLogin(){const r=await db.auth.signInWithPassword({email:val("#lE"),password:$("#lP").value});if(r.error)return alert("Login failed: "+r.error.message);location.reload()}
function put(row){const c=row.coll;if(!D[c])return;const o={...row.data,id:row.id};const i=D[c].findIndex(x=>x.id===row.id);i<0?D[c].push(o):D[c][i]=o}
async function resync(){const r=await db.from("items").select("*");if(r.error)return;for(const c in D)D[c]=[];r.data.forEach(put);render()}

function render(){
  const mm=D.members.find(m=>m.id===meId);
  if(!mm||(mm.resetAt&&mm.resetAt>ls.get("fh_pickAt",0)))return pickMe();
  me=mm.name;
  const m=mem(me);$("#meBtn").classList.remove("hide");$("#meBtn").textContent=m.emoji+" "+m.name;
  $("#nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("");
  const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.value)return; // don't wipe typing
  $("#app").innerHTML=V[tab]();
}
function go(k){tab=k;ls.set("fh_tab",k);document.activeElement?.blur();render();scrollTo(0,0)}
function pickMe(){
  $("#nav").innerHTML="";$("#meBtn").classList.add("hide");
  $("#app").innerHTML=`<div class="card"><h2>Who are you?</h2><div class="who">${D.members.map(m=>`<button style="background:${m.color}" onclick="setMe('${m.id}')">${m.emoji}<br>${esc(m.name)}</button>`).join("")||'<p class="mut">Loading…</p>'}</div></div>`;
}
function setMe(id){meId=id;ls.set("fh_meId",id);ls.set("fh_pickAt",Date.now());render()}


function nextBday(b){const t=new Date();t.setHours(0,0,0,0);const [y,mo,da]=b.date.split("-").map(Number);let n=new Date(t.getFullYear(),mo-1,da);if(n<t)n.setFullYear(t.getFullYear()+1);return{days:Math.round((n-t)/864e5),age:y>1900?n.getFullYear()-y:null}}
function upcoming(){const t=ymd(new Date());return D.events.filter(e=>e.date>=t).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))}

const V={
home(){
  const ev=upcoming().slice(0,4),bd=D.birthdays.map(b=>({...b,...nextBday(b)})).sort((a,b)=>a.days-b.days).slice(0,3);
  const myCh=D.chores.filter(c=>!c.done&&c.to===me),open=D.polls.filter(p=>!(p.votes||{})[me]);
  const inst=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  return `${inst||ls.get("fh_hideG",false)?"":`<div class="card" style="background:var(--acc2)"><b>📲 Put Family Hub on your home screen</b><p class="mut">It'll open like a real app.</p><br><button class="b" onclick="go('settings')">Show me how</button> <button class="g" onclick="ls.set('fh_hideG',true);render()">Hide</button></div>`}<div class="card"><div class="mut">Hi ${esc(me)} 👋</div><div class="big">${new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})}</div></div>
  <div class="card"><h2>📅 Coming up</h2>${ev.map(e=>`<div class="chk"><div class="tx"><b>${esc(e.title)}</b><div class="mut">${fmtD(e.date)}${e.time?" · "+fmtT(e.time):""}</div></div></div>`).join("")||'<p class="mut">Nothing scheduled.</p>'}</div>
  <div class="card"><h2>🎂 Birthdays</h2>${bd.map(b=>`<div class="chk"><div class="tx"><b>${esc(b.name)}</b>${b.age?` turns ${b.age}`:""}</div><b>${b.days===0?"🎉 Today!":b.days+" days"}</b></div>`).join("")||'<p class="mut">None added yet.</p>'}</div>
  <div class="card"><h2>✅ Your chores (${myCh.length})</h2>${myCh.map(c=>`<div class="chk"><input type="checkbox" onchange="upd('chores','${c.id}',{done:true,doneBy:me})"><div class="tx">${esc(c.text)}${c.due?` <span class="mut">· due ${fmtD(c.due)}</span>`:""}</div></div>`).join("")||'<p class="mut">All caught up!</p>'}</div>
  ${open.length?`<div class="card"><h2>📊 Polls waiting on you</h2>${open.map(p=>`<p>• ${esc(p.q)}</p>`).join("")}<br><button class="g" onclick="go('polls')">Vote now</button></div>`:""}
  ${D.notes.length?`<div class="card"><h2>📝 Latest note</h2>${noteHTML(D.notes.sort((a,b)=>b.at-a.at)[0])}</div>`:""}`;
},
notes(){
  const list=D.notes.filter(n=>n.to==="Everyone"||n.to===me||n.by===me).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.at-a.at);
  return `<div class="card"><h2>Leave a note</h2><select id="nTo"><option>Everyone</option>${D.members.filter(m=>m.name!==me).map(m=>`<option>${esc(m.name)}</option>`).join("")}</select>
  <textarea id="nTx" placeholder="Write a note…"></textarea><button class="b" onclick="postNote()">Post</button></div>
  ${list.map(n=>`<div class="card" data-lp="notes:${n.id}">${noteHTML(n,true)}</div>`).join("")||'<p class="mut">No notes yet.</p>'}`;
},
polls(){
  return `<div class="card"><h2>New poll</h2><input id="pQ" placeholder="Question (e.g. Pizza or tacos Friday?)">
  <textarea id="pO" placeholder="Options, one per line"></textarea><button class="b" onclick="postPoll()">Create poll</button></div>
  ${D.polls.sort((a,b)=>b.at-a.at).map(p=>{const v=p.votes||{},tot=Object.keys(v).length;
    return `<div class="card" data-lp="polls:${p.id}"><button class="x" onclick="del('polls','${p.id}')">×</button>${chip(p.by)}<span class="mut">${ago(p.at)}</span><h2 style="margin-top:8px">${esc(p.q)}</h2>
    ${p.opts.map((o,i)=>{const who=Object.keys(v).filter(k=>v[k]===i),pc=tot?Math.round(who.length/tot*100):0;
      return `<div class="opt ${v[me]===i?"v":""}" onclick="vote('${p.id}',${i})"><div class="row"><b>${esc(o)}</b><span style="text-align:right" class="mut">${who.length} · ${pc}%</span></div><div class="bar"><i style="width:${pc}%"></i></div>${who.map(chip).join("")}</div>`}).join("")}
    <p class="mut">${tot} of ${D.members.length} voted · tap an option to vote or change</p></div>`}).join("")}`;
},
cal(){
  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),t=ymd(new Date());
  const has=new Set(D.events.map(e=>e.date));
  D.birthdays.forEach(b=>{const p=b.date.split("-");has.add(`${y}-${p[1]}-${p[2]}`)});
  let cells=["S","M","T","W","T","F","S"].map(d=>`<div class="mut">${d}</div>`).join("")+"<div></div>".repeat(first);
  for(let d=1;d<=n;d++){const k=`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    cells+=`<div class="d ${k===t?"t":""} ${k===calSel?"s":""}" onclick="calSel='${k}';render()">${d}${has.has(k)?'<i class="dot"></i>':""}</div>`}
  const day=D.events.filter(e=>e.date===calSel).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const bd=D.birthdays.filter(b=>b.date.slice(5)===calSel.slice(5));
  return `<div class="card"><div class="row"><button class="g" style="flex:0" onclick="calMonth.setMonth(calMonth.getMonth()-1);render()">‹</button>
  <h2 style="text-align:center;margin:0">${calMonth.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2>
  <button class="g" style="flex:0" onclick="calMonth.setMonth(calMonth.getMonth()+1);render()">›</button></div><br><div class="cal">${cells}</div></div>
  <div class="card"><h2>${fmtD(calSel)}</h2>${bd.map(b=>`<p>🎂 <b>${esc(b.name)}'s birthday</b></p>`).join("")}
  ${day.map(e=>`<div class="chk" data-lp="events:${e.id}"><div class="tx"><b>${esc(e.title)}</b><div class="mut">${e.time?fmtT(e.time)+" · ":""}${e.who?esc(e.who)+" · ":""}added by ${esc(e.by)}</div>${e.notes?`<div class="mut">${esc(e.notes)}</div>`:""}</div><button class="x" onclick="del('events','${e.id}')">×</button></div>`).join("")||(bd.length?"":'<p class="mut">No events.</p>')}</div>
  <div class="card"><h2>Add event</h2><input id="eT" placeholder="Event name"><div class="row"><input id="eD" type="date" value="${calSel}"><input id="eTm" type="time"></div>
  <select id="eW"><option value="">Whole family</option>${D.members.map(m=>`<option>${esc(m.name)}</option>`).join("")}</select>
  <select id="eR"><option value="">Doesn't repeat</option><option value="7">Every week (8 weeks)</option><option value="14">Every 2 weeks (8 times)</option></select>
  <input id="eN" placeholder="Notes (optional)"><button class="b" onclick="postEvent()">Add to calendar</button></div>
  <div class="card"><h2>Upcoming</h2>${upcoming().slice(0,10).map(e=>`<p>${fmtD(e.date)} — <b>${esc(e.title)}</b>${e.time?" "+fmtT(e.time):""}</p>`).join("")||'<p class="mut">Nothing yet.</p>'}</div>`;
},
chores(){
  const open=D.chores.filter(c=>!c.done),done=D.chores.filter(c=>c.done).sort((a,b)=>b.at-a.at).slice(0,15);
  return `<div class="card"><h2>Add chore</h2><input id="cT" placeholder="e.g. Take out trash"><div class="row"><select id="cTo">${D.members.map(m=>`<option ${m.name===me?"selected":""}>${esc(m.name)}</option>`).join("")}<option value="">Anyone</option></select><input id="cD" type="date"></div>
  <button class="b" onclick="postChore()">Add</button></div>
  <div class="card"><h2>To do (${open.length})</h2>${open.map(c=>`<div class="chk" data-lp="chores:${c.id}"><input type="checkbox" onchange="upd('chores','${c.id}',{done:true,doneBy:me})"><div class="tx">${esc(c.text)}<div>${c.to?chip(c.to):'<span class="mut">Anyone</span>'}${c.due?`<span class="mut"> due ${fmtD(c.due)}</span>`:""}</div></div><button class="x" onclick="del('chores','${c.id}')">×</button></div>`).join("")||'<p class="mut">Nothing to do 🎉</p>'}</div>
  <div class="card"><h2>Recently done</h2>${done.map(c=>`<div class="chk done"><input type="checkbox" checked onchange="upd('chores','${c.id}',{done:false})"><div class="tx">${esc(c.text)} <span class="mut">by ${esc(c.doneBy||"")}</span></div><button class="x" onclick="del('chores','${c.id}')">×</button></div>`).join("")||'<p class="mut">—</p>'}</div>`;
},
grocery(){
  const l=D.groceries.sort((a,b)=>(a.got?1:0)-(b.got?1:0)||a.at-b.at);
  return `<div class="card"><div class="row"><input id="gT" placeholder="Add item…" onkeydown="if(event.key==='Enter')postGroc()"><button class="b" style="flex:0" onclick="postGroc()">Add</button></div>
  ${l.map(g=>`<div class="chk ${g.got?"done":""}" data-lp="groceries:${g.id}"><input type="checkbox" ${g.got?"checked":""} onchange="upd('groceries','${g.id}',{got:this.checked})"><div class="tx">${esc(g.text)} <span class="mut">· ${esc(g.by)}</span></div><button class="x" onclick="rm('${g.id}')">×</button></div>`).join("")||'<p class="mut">List is empty.</p>'}
  ${l.some(g=>g.got)?`<br><button class="g" onclick="clearGot()">Clear checked items</button>`:""}</div>`;
},
bdays(){
  const l=D.birthdays.map(b=>({...b,...nextBday(b)})).sort((a,b)=>a.days-b.days);
  return `<div class="card"><h2>Add birthday / anniversary</h2><input id="bN" placeholder="Name (e.g. Grandma)"><input id="bD" type="date"><button class="b" onclick="postBday()">Save</button></div>
  ${l.map(b=>`<div class="card" data-lp="birthdays:${b.id}"><button class="x" onclick="del('birthdays','${b.id}')">×</button><b>${esc(b.name)}</b> <span class="mut">${fmtD(b.date,true)}</span><div class="big">${b.days===0?"🎉 Today!":b.days+" days"}</div>${b.age?`<span class="mut">turns ${b.age}</span>`:""}</div>`).join("")}`;
},
photos(){
  return `<div class="card"><h2>Post a photo</h2><input id="phF" type="file" accept="image/*"><input id="phC" placeholder="Caption"><button class="b" onclick="postPhoto()">Post</button><p class="mut" id="phS"></p></div>
  <div class="photos">${D.photos.sort((a,b)=>b.at-a.at).map(p=>`<div class="card" style="padding:6px" data-lp="photos:${p.id}"><img src="${p.img}" alt=""><p style="margin:6px 2px 2px">${esc(p.cap)}</p><div class="mut">${esc(p.by)} · ${ago(p.at)}${p.by===me?` · <a onclick="del('photos','${p.id}')">delete</a>`:""}</div></div>`).join("")}</div>`;
},
settings(){
  return `${ADMIN?`<div class="card"><h2>Family members</h2>${D.members.map(m=>`<div class="chk" data-lp="members:${m.id}"><span style="font-size:24px">${m.emoji}</span><div class="tx"><b style="color:${m.color}">${esc(m.name)}</b></div><button class="x" onclick="del('members','${m.id}')">×</button></div>`).join("")}
  <br><div class="row"><input id="mE" placeholder="Emoji" style="flex:0 0 70px"><input id="mN" placeholder="Name"><input id="mC" type="color" value="#4a7bd0" style="flex:0 0 50px;padding:2px"></div><button class="b" onclick="postMem()">Add member</button><p class="mut">Hold a member to rename, recolor, or make their phone pick again.</p></div>`:""}
  ${guideHTML()}
  ${ADMIN?`<div class="card"><button class="g" onclick="localStorage.removeItem('fh_meId');meId=null;pickMe()">Switch person on this phone</button> <button class="g" onclick="ADMIN=false;ls.set('fh_adm',false);render()">Hide admin mode</button></div>`:""}`;
}};

function noteHTML(n,full){return `${full&&(n.by===me)?`<button class="x" onclick="del('notes','${n.id}')">×</button>`:""}${chip(n.by)} → ${n.to==="Everyone"?"<b>Everyone</b>":chip(n.to)} <span class="mut">${ago(n.at)}</span>${n.pin?" 📌":""}
  <p style="margin:8px 0;white-space:pre-wrap">${esc(n.text)}</p>${full?`<div>${Object.keys(n.hearts||{}).map(k=>"❤️").join("")}<button class="g" onclick="heart('${n.id}')">❤️ ${Object.keys(n.hearts||{}).length||""}</button> <button class="g" onclick="upd('notes','${n.id}',{pin:${!n.pin}})">${n.pin?"Unpin":"📌 Pin"}</button></div>`:""}`}
function fmtD(s,noYr){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:noYr?undefined:"short",month:"short",day:"numeric"})}
function fmtT(t){const[h,m]=t.split(":").map(Number);return((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")}
const val=id=>$(id).value.trim(),clr=(...ids)=>ids.forEach(i=>$(i).value="");

function postNote(){const t=val("#nTx");if(!t)return;add("notes",{text:t,to:$("#nTo").value});clr("#nTx");$("#nTx").blur()}
function heart(id){const n=D.notes.find(x=>x.id===id),h={...(n.hearts||{})};h[me]?delete h[me]:h[me]=1;upd("notes",id,{hearts:h})}
function postPoll(){const q=val("#pQ"),o=$("#pO").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!q||o.length<2)return alert("Add a question and at least 2 options");add("polls",{q,opts:o,votes:{}});clr("#pQ","#pO");document.activeElement.blur()}
function vote(id,i){upd("polls",id,{["votes."+me]:i})}
function postEvent(){const t=val("#eT"),d=$("#eD").value;if(!t||!d)return alert("Add a name and date");const r=+$("#eR").value,n=r?8:1;
  for(let k=0;k<n;k++){const dt=new Date(d+"T12:00");dt.setDate(dt.getDate()+k*r);add("events",{title:t,date:ymd(dt),time:$("#eTm").value,who:$("#eW").value,notes:val("#eN")})}
  clr("#eT","#eN");calSel=d;document.activeElement.blur()}
function postChore(){const t=val("#cT");if(!t)return;add("chores",{text:t,to:$("#cTo").value,due:$("#cD").value,done:false});clr("#cT");document.activeElement.blur()}
function postGroc(){const t=val("#gT");if(!t)return;add("groceries",{text:t,got:false});clr("#gT")}
function clearGot(){D.groceries.filter(g=>g.got).forEach(g=>rm(g.id))}
function postBday(){const n=val("#bN"),d=$("#bD").value;if(!n||!d)return;add("birthdays",{name:n,date:d});clr("#bN","#bD");document.activeElement.blur()}
function postMem(){const n=val("#mN");if(!n)return;ins("members",{name:n,emoji:val("#mE")||"🙂",color:$("#mC").value});clr("#mN","#mE");document.activeElement.blur()}
function postPhoto(){const f=$("#phF").files[0];if(!f)return;$("#phS").textContent="Uploading…";
  const img=new Image();img.onload=()=>{const s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    add("photos",{img:c.toDataURL("image/jpeg",.7),cap:val("#phC")}).then(()=>{$("#phS").textContent="";clr("#phC");$("#phF").value=""})};img.src=URL.createObjectURL(f)}

let gOS=/iPhone|iPad|iPod/.test(navigator.userAgent)?"ios":"and",gStep=0;
const URLTXT="mwillard0927-ctrl.github.io/family-hub";
const GUIDE={

 ["Scroll down, tap <u>Add to Home Screen</u>",`<div class="pg"><i></i></div><div class="menu" style="left:8px;right:8px;bottom:8px"><div>Copy</div><div>Add to Reading List</div><div>Add Bookmark</div><div class="hi">➕ Add to Home Screen</div><div>Find on Page</div></div><div class="tap" style="left:50%;top:228px"></div>`,"You may need to swipe the share menu up to see it."],
 ["Tap <u>Add</u> in the top-right corner",`<div class="tb top" style="background:#fff"><span>Cancel</span><b>Add to Home Screen</b><b style="color:#0a7aff">Add</b></div><div class="pg" style="top:50px;display:flex;gap:8px;align-items:center"><b style="width:40px;height:40px;border-radius:10px;background:var(--acc);display:block;text-align:center;line-height:40px">🏡</b><span style="font-size:12px">Family Hub</span></div><div class="tap" style="left:148px;top:17px"></div>`,"Leave the name as Family Hub."],
 ["Open it from your home screen 🎉",`<div class="home"><b></b><b></b><b></b><b></b><b></b><b class="me">🏡</b><b></b><b></b></div><div class="tap" style="left:59px;top:96px"></div>`,"From now on, open it from this icon — no browser bar."]],
and:[
 ["Open the link in <u>Chrome</u>",`<div class="tb top"><span>🔒 family-hub</span><b>⋮</b></div><div class="pg"><div class="hd">🏡 Family Hub</div><i></i><i></i><i style="width:60%"></i></div><div class="tap" style="left:50%;top:17px"></div>`,"Samsung Internet works too — look for its menu ≡ at the bottom."],
 ["Tap the <u>⋮</u> menu at the top-right",`<div class="tb top"><span>🔒 family-hub</span><b>⋮</b></div><div class="pg"><div class="hd">🏡 Family Hub</div><i></i><i></i></div><div class="tap" style="left:150px;top:17px"></div><div class="fin" style="left:142px;top:30px">👆</div>`,"Three dots stacked up and down."],
 ["Tap <u>Add to Home screen</u> or <u>Install app</u>",`<div class="pg"><i></i></div><div class="menu" style="right:6px;top:6px;width:130px"><div>New tab</div><div>History</div><div>Downloads</div><div>Share…</div><div class="hi">📲 Add to Home screen</div><div>Settings</div></div><div class="tap" style="left:95px;top:136px"></div>`,"Either name — Chrome changes the wording sometimes."],
 ["Tap <u>Install</u> (or <u>Add</u>)",`<div class="pg"><i></i><i></i></div><div class="menu" style="left:10px;right:10px;top:90px;padding:12px"><b>Install app?</b><div style="border:none;display:flex;gap:8px;align-items:center"><b style="width:30px;height:30px;border-radius:8px;background:var(--acc);display:block;text-align:center;line-height:30px">🏡</b>Family Hub</div><div style="border:none;text-align:right"><span style="margin-right:14px">Cancel</span><b style="color:var(--acc)">Install</b></div></div><div class="tap" style="left:130px;top:178px"></div>`,"If it asks, tap Add automatically."],
 ["Open it from your home screen 🎉",`<div class="home"><b></b><b></b><b></b><b></b><b></b><b class="me">🏡</b><b></b><b></b></div><div class="tap" style="left:59px;top:96px"></div>`,"It opens full-screen like a regular app."]]};
function guideHTML(){const st=GUIDE[gOS],[t,ph,tip]=st[gStep];
  return `<div class="card"><h2>📲 Install on your phone</h2>
  <div class="seg"><button class="${gOS==="ios"?"on":""}" onclick="gOS='ios';gStep=0;render()"> iPhone</button><button class="${gOS==="and"?"on":""}" onclick="gOS='and';gStep=0;render()">🤖 Android</button></div>
  <div class="mut" style="text-align:center">Step ${gStep+1} of ${st.length}</div>
  <div class="stepT">${t}</div><div class="ph" key="${gOS+gStep}">${ph}</div>
  <p class="mut" style="text-align:center;min-height:36px">${tip}</p>
  <div class="dots">${st.map((_,i)=>`<span class="${i===gStep?"on":""}" onclick="gStep=${i};render()"></span>`).join("")}</div>
  <div class="row"><button class="g" ${gStep?"":"disabled style='opacity:.4'"} onclick="gStep--;render()">‹ Back</button><button class="b" onclick="gStep=(gStep+1)%${st.length};render()">${gStep===st.length-1?"Start over":"Next ›"}</button></div>
  <p class="mut" style="text-align:center;margin-top:10px">Link to share: <b>${URLTXT}</b></p></div>`}
const ADMIN_PIN="0927";
let lpT=null,lpEl=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-lp]");if(!el)return;
  const k=el.dataset.lp;if(k!=="admin"&&!ADMIN)return;lpEl=el;
  lpT=setTimeout(()=>{lpT=null;navigator.vibrate?.(30);el.classList.add("lpOn");setTimeout(()=>el.classList.remove("lpOn"),300);
    if(k==="admin"){if(ADMIN)return;if(prompt("PIN")===ADMIN_PIN){ADMIN=true;ls.set("fh_adm",true);navigator.vibrate?.([30,60,30]);render()}return}
    const[c,id]=k.split(":");editItem(c,id)},650)});
["pointerup","pointercancel","pointermove"].forEach(t=>document.addEventListener(t,e=>{if(t==="pointermove"&&lpEl&&Math.abs(e.movementX)+Math.abs(e.movementY)<4)return;clearTimeout(lpT);lpT=null}));
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-lp]"))e.preventDefault()});
document.addEventListener("click",e=>{if(e.target.closest(".lpOn"))e.stopPropagation()},true);
const LABEL={text:"Text",to:"To / assigned to",q:"Question",opts:"Options (one per line)",title:"Title",date:"Date (YYYY-MM-DD)",time:"Time (HH:MM)",who:"For",notes:"Notes",due:"Due (YYYY-MM-DD)",name:"Name",emoji:"Emoji",color:"Color",cap:"Caption",by:"Posted by"};
function editItem(c,id){const it=D[c].find(x=>x.id===id);if(!it)return;
  const keys=Object.keys(LABEL).filter(k=>k in it);
  const box=document.createElement("div");box.id="sheet";
  box.innerHTML=`<div class="card"><h2>✏️ Edit ${c.replace(/s$/,"")}</h2>${keys.map(k=>`<label class="f">${LABEL[k]}</label>${k==="opts"?`<textarea data-k="opts">${esc(it.opts.join("\n"))}</textarea>`:k==="color"?`<input data-k="color" type="color" value="${esc(it.color)}">`:k==="text"||k==="notes"?`<textarea data-k="${k}">${esc(it[k])}</textarea>`:`<input data-k="${k}" value="${esc(it[k])}">`}`).join("")}
  ${c==="polls"?`<button class="g" onclick="upd('polls','${id}',{votes:{}});closeSheet()">Clear all votes</button><br><br>`:""}
  ${c==="members"?`<button class="g" onclick="upd('members','${id}',{resetAt:Date.now()});closeSheet();alert('Their phone will ask them to pick a name again.')">Make their phone pick a name again</button><br><br>`:""}
  <div class="row"><button class="b" onclick="saveEdit('${c}','${id}')">Save</button><button class="g" onclick="closeSheet()">Cancel</button><button class="g" style="color:var(--red)" onclick="if(confirm('Delete permanently?')){rm('${id}');closeSheet()}">Delete</button></div></div>`;
  box.onclick=e=>{if(e.target===box)closeSheet()};document.body.appendChild(box)}
function closeSheet(){document.getElementById("sheet")?.remove()}
function saveEdit(c,id){const o={};document.querySelectorAll("#sheet [data-k]").forEach(el=>{const k=el.dataset.k;o[k]=k==="opts"?el.value.split("\n").map(x=>x.trim()).filter(Boolean):el.value});
  const old=D[c].find(x=>x.id===id);
  if(c==="members"&&o.name&&o.name!==old.name){const on=old.name;for(const cc of Object.keys(D))if(cc!=="members")D[cc].forEach(x=>{const ch={};if(x.by===on)ch.by=o.name;if(x.to===on)ch.to=o.name;if(x.who===on)ch.who=o.name;if(x.doneBy===on)ch.doneBy=o.name;if(Object.keys(ch).length)upd(cc,x.id,ch)})}
  upd(c,id,o);closeSheet()}
